<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Livonno — Acesso protegido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--panel:#121212;--line:#242424;--lima:#ccff00;--dim:#9a9a9a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:#ececec;font-family:Inter,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:36px 32px;text-align:center}
.mark{width:44px;height:44px;margin:0 auto 20px;border-radius:8px;background:var(--ink);border:1px solid var(--lima);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:var(--lima);font-size:20px}
h1{font-family:'Space Grotesk';font-size:1.15rem;margin-bottom:8px}
p.sub{color:var(--dim);font-size:.88rem;margin-bottom:24px;line-height:1.5}
input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:5px;padding:12px 14px;color:#fff;font-family:'IBM Plex Mono';font-size:.9rem;margin-bottom:12px;outline:none}
input:focus{border-color:var(--lima)}
button{width:100%;background:var(--lima);color:var(--ink);border:none;border-radius:5px;padding:12px;font-family:'Space Grotesk';font-weight:700;font-size:.92rem;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:default}
.err{color:#ff6b6b;font-family:'IBM Plex Mono';font-size:.76rem;margin-top:12px;min-height:1em}
</style>
</head>
<body>

    <div class="mark">L.</div>

    <p class="sub">Documento interno da Livonno.<br>Digite a senha para abrir.</p>
    <input type="password" id="pw" placeholder="Senha" autofocus>

  <script>
    function b64ToBytes(b64){ return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }
    async function deriveKey(password, saltB64, iterations){
      const enc = new TextEncoder();
      const salt = b64ToBytes(saltB64);
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt, iterations, hash:'SHA-256'},
        keyMaterial,
        {name:'AES-GCM', length:256},
        false,
        ['decrypt']
      );
    }
    async function tryDecrypt(password){
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      btn.disabled = true; err.textContent = '';
      try {
        const payloadB64 = document.getElementById('payload').textContent;
        const payload = JSON.parse(atob(payloadB64));
        const key = await deriveKey(password, payload.salt, payload.iterations);
        const iv = b64ToBytes(payload.iv);
        const ciphertext = b64ToBytes(payload.ciphertext);
        const authTag = b64ToBytes(payload.authTag);
        const combined = new Uint8Array(ciphertext.length + authTag.length);
        combined.set(ciphertext); combined.set(authTag, ciphertext.length);
        const decrypted = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, combined);
        const html = new TextDecoder().decode(decrypted);
        document.open(); document.write(html); document.close();
      } catch(e){
        err.textContent = 'Senha incorreta. Tente de novo.';
        btn.disabled = false;
      }
    }
    document.getElementById('btn').addEventListener('click', () => tryDecrypt(document.getElementById('pw').value));
    document.getElementById('pw').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryDecrypt(e.target.value); });
  </script>
